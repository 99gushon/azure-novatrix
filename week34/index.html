<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novatrix AB - Kundtjänst</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Novatrix AB</h1>
    <p>Kundtjänst</p>
</header>

<main>
    <h2>Skapa ett ärende</h2>

    <p>Fyll i formuläret nedan för att kontakta Novatrix AB:s kundtjänst.</p>

    <form>
        <label for="name">Namn</label>
        <input type="text" id="name" name="name">

        <label for="email">E-post</label>
        <input type="email" id="email" name="email">

        <label for="message">Meddelande</label>
        <textarea id="message" name="message"></textarea>

        <button type="submit">Skicka ärende</button>
    </form>
</main>

</body>
</html>
